name: 실거래가 업데이트

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "가져올 개월 수 (0이면 자동: 처음 24개월, 이후 3개월)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 국토부 실거래가 받기
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MONTHS: ${{ github.event.inputs.months || '0' }}
        run: python scripts/fetch.py

      - name: 저장하기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "바뀐 거래가 없습니다"
          else
            git commit -m "실거래가 업데이트 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
