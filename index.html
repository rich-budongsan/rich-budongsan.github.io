<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리치부동산 실거래가</title>
<meta name="description" content="서울·화성 아파트 실거래가를 바로 검색하세요. 국토교통부 실거래가 매일 업데이트 - 리치부동산">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD21F;--ink:#1C1C1E;--sub:#6b6b70;--line:#ececec;--bg:#fff;--soft:#FFF7D1;--red:#E5383B;--blue:#2F6FEB}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",sans-serif;word-break:keep-all;overflow-x:clip}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.top{background:var(--y)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;text-decoration:none}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--y);font-style:normal;font-size:18px}
.upd{font-size:13px;font-weight:500;opacity:.75}
.hero{background:var(--y);padding:18px 0 34px}
.hero h1{margin:0 0 16px;font-size:clamp(26px,4vw,40px);line-height:1.15;font-weight:900;letter-spacing:-.5px}
.sbar{display:flex;gap:10px;flex-wrap:wrap}
.sbox{flex:1 1 320px;display:flex;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:0 16px;height:58px}
.sbox input{flex:1;border:0;outline:0;font-size:18px;background:transparent;height:100%}
.sbox svg{flex:none;margin-right:10px}
#clear{border:0;background:#eee;border-radius:50%;width:28px;height:28px;cursor:pointer;display:none}
select{height:58px;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:0 14px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:6px;margin:22px 0 12px;flex-wrap:wrap;align-items:center}
.tab{border:0;background:#f3f3f3;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;min-height:44px}
.tab.on{background:var(--ink);color:var(--y)}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--ink);background:var(--soft)}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fil select{height:40px;border-width:2px;border-radius:999px;font-size:14px}
.cnt{margin-left:auto;font-size:14px;color:var(--sub)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--sub);font-weight:500;text-align:left;padding:10px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right;white-space:nowrap}
.price{font-weight:900;font-size:17px;white-space:nowrap}
.nm{font-weight:700;text-decoration:none;cursor:pointer}
.nm:hover{text-decoration:underline}
.sm{font-size:13px;color:var(--sub)}
.b{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.b.hi{background:var(--red);color:#fff}.b.dir{background:#eee;color:#555}.b.cx{background:#555;color:#fff}
tr.cx td{opacity:.45}tr.cx .price{text-decoration:line-through}
.empty{padding:50px 10px;text-align:center;color:var(--sub)}
.more{display:block;margin:18px auto;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:10px 26px;font-weight:700;cursor:pointer}
/* detail */
.back{border:0;background:none;font-weight:700;cursor:pointer;padding:10px 0;min-height:44px}
.dh h2{margin:4px 0 2px;font-size:clamp(24px,3.4vw,34px);font-weight:900;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.st{background:var(--soft);border-radius:16px;padding:14px 16px}
.st small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.st b{font-size:clamp(18px,2.6vw,26px);font-weight:900;white-space:nowrap}
.fig{position:relative;height:260px;border:1px solid var(--line);border-radius:16px;margin-bottom:18px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.office{background:var(--ink);color:#fff;margin-top:50px;padding:34px 0}
.office .wrap{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center;justify-content:space-between}
.office h3{margin:0;font-size:22px;font-weight:900}
.office h3 span{color:var(--y)}
.office p{margin:4px 0 0;font-size:14px;opacity:.8}
.tels{display:flex;gap:10px;flex-wrap:wrap}
.tels a{background:var(--y);color:var(--ink);text-decoration:none;font-weight:900;font-size:20px;border-radius:14px;padding:10px 18px;white-space:nowrap}
.foot{font-size:12px;color:var(--sub);padding:18px 0 40px;line-height:1.7}
@media(max-width:700px){
 .hide-m{display:none}
 thead{display:none}
 table,tbody,tr,td{display:block}
 tr{display:grid;grid-template-columns:1fr auto;padding:12px 0;border-bottom:1px solid var(--line)}
 td{border:0;padding:2px 0}
 td.c-n{grid-column:1/-1}
 td.c-p{grid-row:2/4;grid-column:2;align-self:center}
 .stats{grid-template-columns:1fr 1fr}.st:last-child{grid-column:1/-1}
 .logo{font-size:17px}.upd{font-size:11px;text-align:right;max-width:92px;line-height:1.3}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <a class="logo" href="#"><i>R</i>리치부동산 실거래가</a>
 <span class="upd" id="upd"></span>
</div></header>

<section class="hero"><div class="wrap">
 <h1>서울·화성 아파트 실거래가</h1>
 <div class="sbar">
  <label class="sbox"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
   <input id="q" type="search" placeholder="단지명이나 동 이름 (예: 봉담자이, 대치동)" autocomplete="off" aria-label="단지 검색">
   <button id="clear" aria-label="지우기">✕</button></label>
  <select id="reg" aria-label="지역"><option value="">전체 지역</option></select>
 </div>
</div></section>

<main class="wrap" id="app"></main>

<section class="office"><div class="wrap">
 <div><h3>궁금한 시세는 <span>리치부동산</span>에 물어보세요</h3>
 <p id="addr"></p></div>
 <div class="tels" id="tels"></div>
</div></section>
<div class="wrap foot">
 자료: 국토교통부 아파트 매매 실거래가 (공공데이터포털 API), 매일 새벽 자동 업데이트 · 계약일 기준 · 면적은 전용면적<br>
 <b>최고가</b> 표시는 이 사이트가 모은 기간(최근 약 2년) 안에서 같은 면적의 이전 거래보다 높은 거래예요. 계약이 해제된 거래는 줄을 그어 표시해요.<br>
 실거래 신고는 계약 후 30일 안에 하게 되어 있어서 최근 거래는 늦게 올라올 수 있어요.
</div>

<script>
{
const CONFIG={
  office:"리치부동산",
  address:"화성시 삼봉안길 30, 자이프라이드시티 단지내상가 101호 · 오전 10시~오후 7시 30분 (일요일 휴무)",
  phones:["031-294-8009","010-4394-8600"]
};
const $=s=>document.querySelector(s);
const app=$('#app'),q=$('#q'),reg=$('#reg'),clr=$('#clear');
let IDX=null,REC=null,state={tab:'new',area:'',dir:true,hi:false,shown:60};

$('#addr').textContent=CONFIG.address;
$('#tels').innerHTML=CONFIG.phones.map(p=>`<a href="tel:${p.replace(/-/g,'')}">${p}</a>`).join('');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=a=>{const e=Math.floor(a/10000),r=a%10000;return (e?e+'억':'')+(r?(e?' ':'')+r.toLocaleString():'')||'0'};
const py=ar=>Math.round(ar/3.3058);
const area=ar=>`${Math.round(ar)}㎡<span class="sm"> · ${py(ar)}평</span>`;
const md=d=>d.slice(2).replace(/-/g,'.');
const norm=s=>s.replace(/\s/g,'').toLowerCase();
const bucket=ar=>ar<60?'s':ar<=85?'m':'l';

async function getJSON(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(r.status);return r.json()}
async function loadIndex(){if(!IDX){IDX=await getJSON('data/index.json');fillRegions();if(!$('#upd').textContent)$('#upd').textContent=IDX.updated+' 업데이트'}return IDX}
function fillRegions(){
  const rs=[...new Set(IDX.c.map(c=>c[2]))].sort((a,b)=>(a.startsWith('화성')?-1:0)-(b.startsWith('화성')?-1:0)||a.localeCompare(b,'ko'));
  reg.innerHTML='<option value="">전체 지역</option>'+rs.map(r=>`<option>${esc(r)}</option>`).join('');
  try{const s=localStorage.getItem('reg');if(s&&rs.includes(s))reg.value=s}catch(e){}
}
function notReady(){app.innerHTML=`<div class="empty"><b>데이터를 준비하고 있어요</b><br>첫 자동 수집이 끝나면 여기에 실거래가가 나타나요.</div>`}

function badges(c,g,hi){return (hi&&!c?'<span class="b hi">최고가</span>':'')+(g?'<span class="b dir">직거래</span>':'')+(c?'<span class="b cx">해제</span>':'')}

/* 새 거래 */
function filters(){
  return `<div class="fil">
   <button class="chip ${state.area===''?'on':''}" data-a="">전체 면적</button>
   <button class="chip ${state.area==='s'?'on':''}" data-a="s">60㎡ 미만</button>
   <button class="chip ${state.area==='m'?'on':''}" data-a="m">60~85㎡</button>
   <button class="chip ${state.area==='l'?'on':''}" data-a="l">85㎡ 초과</button>
   <button class="chip ${state.dir?'on':''}" data-t="dir">직거래 빼기</button>
   <button class="chip ${state.hi?'on':''}" data-t="hi">최고가만</button>
   <span class="cnt" id="cnt"></span></div>`
}
function renderNew(){
  const r=reg.value;
  let t=REC.t.filter(x=>(!r||x[2]===r)&&(!state.area||bucket(x[6])===state.area)&&(!state.dir||!x[9])&&(!state.hi||(x[10]&&!x[8])));
  const rows=t.slice(0,state.shown).map(x=>`<tr class="${x[8]?'cx':''}">
   <td class="c-n"><a class="nm" href="#c${esc(x[0])}">${esc(x[1])}</a>${badges(x[8],x[9],x[10])}</td>
   <td class="sm">${esc(x[2])} ${esc(x[3])}</td>
   <td>${area(x[6])}</td><td class="num hide-m">${x[7]}층</td>
   <td class="num sm">${md(x[4])}</td>
   <td class="num c-p"><span class="price">${won(x[5])}</span></td></tr>`).join('');
  app.innerHTML=tabs()+filters()+(t.length?`<table><thead><tr><th>단지</th><th>지역</th><th>면적</th><th class="num hide-m">층</th><th class="num">계약일</th><th class="num">거래가</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">조건에 맞는 최근 거래가 없어요</div>')+(t.length>state.shown?'<button class="more" id="more">더 보기</button>':'');
  $('#cnt').textContent=`최근 거래 ${t.length.toLocaleString()}건`;
}
function tabs(){return `<div class="tabs"><button class="tab ${state.tab==='new'?'on':''}" data-tab="new">새 거래</button><button class="tab ${state.tab==='find'?'on':''}" data-tab="find">단지 찾기</button></div>`}

/* 단지 찾기 */
async function renderFind(){
  try{await loadIndex()}catch(e){return notReady()}
  const k=norm(q.value),r=reg.value;
  let c=IDX.c.filter(x=>(!r||x[2]===r)&&(!k||norm(x[1]).includes(k)||norm(x[3]).includes(k)));
  const rows=c.slice(0,state.shown).map(x=>`<tr><td class="c-n"><a class="nm" href="#c${esc(x[0])}">${esc(x[1])}</a></td>
   <td class="sm">${esc(x[2])} ${esc(x[3])}</td><td class="num sm hide-m">${x[4]}건</td>
   <td class="sm num">최근 ${md(x[5])} · ${Math.round(x[7])}㎡</td><td class="num c-p"><span class="price">${won(x[6])}</span></td></tr>`).join('');
  app.innerHTML=tabs()+`<div class="fil"><span class="cnt" style="margin-left:0">${k||r?'검색 결과':'거래 많은 순'} ${c.length.toLocaleString()}곳</span></div>`+
   (c.length?`<table><thead><tr><th>단지</th><th>지역</th><th class="num hide-m">거래</th><th class="num">최근 거래</th><th class="num">최근 거래가</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">찾는 단지가 없어요. 이름을 짧게 입력해 보세요 (예: 자이)</div>')+
   (c.length>state.shown?'<button class="more" id="more">더 보기</button>':'');
}

/* 단지 상세 */
let CX=null;
async function renderDetail(id){
  app.innerHTML='<div class="empty">불러오는 중…</div>';
  try{CX=await getJSON(`data/c/${encodeURIComponent(id)}.json`)}catch(e){app.innerHTML='<div class="empty">단지 정보를 찾지 못했어요</div>';return}
  const areas=[...new Set(CX.t.map(t=>Math.round(t[2])))].sort((a,b)=>a-b);
  const cnt=a=>CX.t.filter(t=>Math.round(t[2])===a).length;
  const def=areas.reduce((m,a)=>cnt(a)>cnt(m)?a:m,areas[0]);
  CX.sel=def;
  app.innerHTML=`<button class="back" id="back">← 목록으로</button>
   <div class="dh"><div class="sm">${esc(CX.r)} ${esc(CX.u)} ${esc(CX.j)}${CX.by?` · ${CX.by}년 준공`:''}</div><h2>${esc(CX.n)}</h2></div>
   <div class="fil" style="margin-top:14px" id="areas">${areas.map(a=>`<button class="chip" data-ar="${a}">${a}㎡ (${py(a)}평)</button>`).join('')}</div>
   <div class="stats" id="stats"></div><div class="fig"><svg id="chart"></svg></div><div id="trades"></div>`;
  drawArea();
}
function drawArea(){
  const a=CX.sel,ts=CX.t.filter(t=>Math.round(t[2])===a),ok=ts.filter(t=>!t[5]);
  document.querySelectorAll('#areas .chip').forEach(b=>b.classList.toggle('on',+b.dataset.ar===a));
  const last=ok[0],max=ok.reduce((m,t)=>t[1]>m[1]?t:m,ok[0]||ts[0]);
  $('#stats').innerHTML=`<div class="st"><small>최근 거래가</small><b>${last?won(last[1]):'-'}</b><div class="sm">${last?md(last[0])+' · '+last[3]+'층':''}</div></div>
   <div class="st"><small>수집 기간 최고가</small><b>${max?won(max[1]):'-'}</b><div class="sm">${max?md(max[0]):''}</div></div>
   <div class="st"><small>거래 건수</small><b>${ts.length}건</b><div class="sm">해제 ${ts.length-ok.length}건 포함</div></div>`;
  $('#trades').innerHTML=`<table><thead><tr><th>계약일</th><th>면적</th><th class="num">층</th><th class="hide-m">동</th><th class="num">거래가</th></tr></thead><tbody>${ts.map(t=>`<tr class="${t[5]?'cx':''}">
   <td class="c-n">${md(t[0])}${badges(t[5],t[6],t[7])}</td><td>${area(t[2])}</td><td class="num">${t[3]}층</td><td class="hide-m sm">${esc(t[4])||'-'}</td><td class="num c-p"><span class="price">${won(t[1])}</span></td></tr>`).join('')}</tbody></table>`;
  chart(ok.slice().reverse());
}
const svg=()=>$('#chart');
function chart(pts){
  const s=svg();if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  if(pts.length<1){s.innerHTML='';return}
  const N=W<520,P={l:N?10:62,r:N?10:16,t:18,b:30};
  const tx=pts.map(p=>Date.parse(p[0])),ys=pts.map(p=>p[1]);
  let x0=Math.min(...tx),x1=Math.max(...tx);if(x0===x1){x0-=864e5*15;x1+=864e5*15}
  let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.15||y1*.05;y0-=pad;y1+=pad;
  const X=t=>P.l+(t-x0)/(x1-x0)*(W-P.l-P.r),Y=v=>P.t+(1-(v-y0)/(y1-y0))*(H-P.t-P.b);
  let g='';
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${N?P.l+2:P.l-8}" y="${N?y-4:y+4}" text-anchor="${N?'start':'end'}" font-size="11" fill="#888">${won(Math.round(v/100)*100)}</text>`}
  const yrs=new Set();tx.forEach(t=>yrs.add(new Date(t).getFullYear()));
  [...yrs].forEach(yr=>{const t=Date.parse(yr+'-01-01');if(t>x0&&t<x1)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${P.t}" y2="${H-P.b}" stroke="#ddd" stroke-dasharray="3 3"/><text x="${X(t)+4}" y="${H-10}" font-size="11" fill="#888">${yr}</text>`});
  g+=`<text x="${P.l}" y="${H-10}" font-size="11" fill="#888">${md(pts[0][0]).slice(0,5)}</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+X(tx[i]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
  g+=`<path d="${line}" fill="none" stroke="#1C1C1E" stroke-width="1.5" opacity=".35"/>`;
  g+=pts.map((p,i)=>`<circle cx="${X(tx[i])}" cy="${Y(p[1])}" r="${p[7]?5:4}" fill="${p[7]?'#E5383B':'#FFD21F'}" stroke="#1C1C1E" stroke-width="1.5"><title>${md(p[0])} ${won(p[1])} ${p[3]}층</title></circle>`).join('');
  s.innerHTML=g;
}
const ro=new ResizeObserver(()=>{if(CX&&location.hash.startsWith('#c'))chart(CX.t.filter(t=>Math.round(t[2])===CX.sel&&!t[5]).reverse())});
ro.observe(document.body);

/* 화면 전환 */
async function route(){
  const h=location.hash;
  if(h.startsWith('#c')&&h.length>2){window.scrollTo(0,0);return renderDetail(decodeURIComponent(h.slice(2)))}
  CX=null;
  if(state.tab==='find'||q.value.trim())return renderFind();
  if(!REC){try{REC=await getJSON('data/recent.json');$('#upd').textContent=REC.updated+' 업데이트'}catch(e){return notReady()}}
  renderNew();
}
let timer;
q.addEventListener('input',()=>{clr.style.display=q.value?'block':'none';state.shown=60;state.tab=q.value.trim()?'find':state.tab;clearTimeout(timer);timer=setTimeout(()=>{if(location.hash.startsWith('#c'))history.pushState('', '', location.pathname);route()},120)});
clr.addEventListener('click',e=>{e.preventDefault();q.value='';clr.style.display='none';state.tab='new';route();q.focus()});
reg.addEventListener('change',()=>{try{localStorage.setItem('reg',reg.value)}catch(e){}state.shown=60;if(location.hash.startsWith('#c'))history.pushState('','',location.pathname);route()});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){state.tab=b.dataset.tab;state.shown=60;if(b.dataset.tab==='new'){q.value='';clr.style.display='none'}route()}
  else if(b.dataset.a!==undefined){state.area=b.dataset.a;state.shown=60;renderNew()}
  else if(b.dataset.t){state[b.dataset.t]=!state[b.dataset.t];state.shown=60;renderNew()}
  else if(b.id==='more'){state.shown+=60;state.tab==='find'||q.value.trim()?renderFind():renderNew()}
  else if(b.id==='back'){history.length>1?history.back():(location.hash='')}
  else if(b.dataset.ar){CX.sel=+b.dataset.ar;drawArea()}
});
window.addEventListener('hashchange',route);
loadIndex().catch(()=>{});
route();
}
</script>
</body>
